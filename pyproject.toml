[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maysani-quant"
version = "0.1.0"
description = "Maysani Quant V0.1 - deterministic FX research engine (no LLM dependency)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
maysani-quant = "maysani_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "invariant: enforces a non-negotiable project invariant (Section 12/22)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: keep (str, Enum) rather than StrEnum. StrEnum changes str() output,
# and journal/record serialisation must not shift under a lint upgrade.
ignore = ["E501", "UP042"]
